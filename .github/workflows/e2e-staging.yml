name: E2E Staging Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  issue_comment:
    types: [ created ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run E2E Tests on Vercel Preview
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # For issue_comment: only run when a maintainer comments /run-e2e <url> on a PR
    if: |
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/run-e2e') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # For PR comments, checkout the PR's branch (works with forks too)
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head',
            github.event.issue.number) || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Install OS dependencies for browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox

      - name: Wait for Vercel deployment
        if: github.event_name != 'issue_comment'
        run: sleep 60

      - name: Get Vercel Preview URL
        id: get-vercel-preview-url
        if: github.event_name != 'issue_comment'
        uses: zentered/vercel-preview-url@v1.4.0
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Resolve Vercel Preview URL
        id: resolve-url
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Extract URL from comment: /run-e2e https://my-project-abc123.vercel.app
            URL=$(echo "${{ github.event.comment.body }}" | grep -oP 'https?://\S+' | head -1)
            echo "url=$URL" >> $GITHUB_OUTPUT
          else
            echo "url=https://${{ steps.get-vercel-preview-url.outputs.preview_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Display Vercel Preview URL
        run: |
          echo "Vercel Preview URL: ${{ steps.resolve-url.outputs.url }}"

      - name: Run Playwright tests against Vercel Preview
        run: pnpm exec playwright test staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve-url.outputs.url }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
